<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Subtitles & Translation</title>
    <style>
        :root {
            --bg-color: #f4f4f9;
            --card-bg: #ffffff;
            --text-color: #333;
            --interim-color: #888;
            --border-color: #ddd;
            --accent-color: #007bff;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-color);
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            background-color: var(--card-bg);
            padding: 1rem 2rem;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        h1 {
            margin: 0;
            font-size: 1.5rem;
        }

        #status {
            font-size: 0.9rem;
            padding: 0.3rem 0.8rem;
            border-radius: 1rem;
            background-color: #eee;
        }

        #status.connected {
            background-color: #d4edda;
            color: #155724;
        }

        #status.disconnected {
            background-color: #f8d7da;
            color: #721c24;
        }

        .controls {
            display: flex;
            gap: 15px;
            align-items: center;
        }

        .controls select {
            padding: 5px;
            border-radius: 4px;
        }

        .controls button {
            padding: 5px 10px;
            border-radius: 4px;
            border: none;
            background: #007bff;
            color: white;
            cursor: pointer;
        }

        main {
            flex: 1;
            display: grid;
            grid-template-columns: 1fr 1fr 1fr 1fr 1fr;
            gap: 1rem;
            padding: 1rem;
            overflow: hidden;
            /* Columns scroll independently */
        }

        .column {
            background-color: var(--card-bg);
            border-radius: 8px;
            border: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .column-header {
            padding: 1rem;
            font-weight: bold;
            border-bottom: 1px solid var(--border-color);
            background-color: #f8f9fa;
        }

        .column-content {
            flex: 1;
            overflow-y: auto;
            padding: 1rem;
            display: flex;
            flex-direction: column;
            gap: 0.8rem;
            scroll-behavior: smooth;
        }

        .segment {
            padding: 0.8rem;
            border-radius: 6px;
            background-color: #fff;
            border: 1px solid #eee;
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.05);
            transition: all 0.2s ease;
        }

        .segment.interim {
            color: var(--interim-color);
            font-style: italic;
            border-style: dashed;
        }

        .segment.final {
            color: var(--text-color);
            border-style: solid;
            border-left: 4px solid var(--accent-color);
        }

        /* Scrollbar styling */
        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: #f1f1f1;
        }

        ::-webkit-scrollbar-thumb {
            background: #ccc;
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #aaa;
        }
    </style>
</head>

<body>
    <header>
        <h1>Live Subtitles</h1>
        <div style="margin-left: 20px; display: flex; gap: 8px; align-items: center;">
            <a href="/live" target="_blank" style="color: var(--accent-color); text-decoration: none; font-weight: bold; font-size: 0.9rem; background: #e7f3ff; padding: 5px 12px; border-radius: 4px; border: 1px solid var(--accent-color);">👁 Open Viewer</a>
            <a href="/telemetry" class="telemetry-btn" style="color: #28a745; text-decoration: none; font-weight: bold; font-size: 0.9rem; background: #e8f5e9; padding: 5px 12px; border-radius: 4px; border: 1px solid #28a745;" title="Telemetrie Dashboard">📊 Telemetrie</a>
        </div>

        <div class="controls">
            <label>Source:
                <select id="source-lang">
                    <option value="nl-NL">Dutch (Nederlands)</option>
                    <option value="en-US">English (English)</option>
                </select>
            </label>

            <label>Trans 1:
                <select id="target-lang-1">
                    <option value="en">English (English)</option>
                    <option value="fr">French (Français)</option>
                    <option value="de">German (Deutsch)</option>
                    <option value="ru">Russian (Русский)</option>
                    <option value="uk">Ukrainian (Українська)</option>
                    <option value="fa">Farsi (فارسی)</option>
                    <option value="ar">Arabic (العربية)</option>
                </select>
            </label>

            <label><input type="checkbox" id="enable-trans-3" checked> Trans 2 (Chained):
                <select id="target-lang-3">
                    <option value="en">English (English)</option>
                    <option value="nl" selected>Dutch (Nederlands)</option>
                    <option value="fr">French (Français)</option>
                    <option value="de">German (Deutsch)</option>
                </select>
            </label>

            <label>Trans 3 (Direct):
                <select id="target-lang-2">
                    <option value="en">English (English)</option>
                    <option value="fr">French (Français)</option>
                    <option value="de">German (Deutsch)</option>
                    <option value="ru" selected>Russian (Русский)</option>
                    <option value="uk">Ukrainian (Українська)</option>
                    <option value="fa">Farsi (فارسی)</option>
                    <option value="ar">Arabic (العربية)</option>
                </select>
            </label>

            <label><input type="checkbox" id="enable-trans-4" checked> Trans 4 (Chained):
                <select id="target-lang-4">
                    <option value="en">English (English)</option>
                    <option value="fr">French (Français)</option>
                    <option value="de">German (Deutsch)</option>
                    <option value="nl" selected>Dutch (Nederlands)</option>
                </select>
            </label>

            <label>Input:
                <!-- Hidden by default until scanned? Or just show "Default" -->
                <select id="audio-device" style="max-width: 150px;">
                    <option value="default">Default Mic</option>
                    <option value="demo_file" selected>Demo: BV.wav</option>
                </select>
            </label>
            <button id="rescan-btn" title="Rescan Input Devices">🔄</button>

            <button id="pause-btn">Pause</button>
            <button id="stop-btn"
                style="background:#dc3545;color:white;border:none;padding:5px 15px;border-radius:4px;cursor:pointer;"
                title="Stop the server">⏹ Stop</button>
        </div>

        <div style="display: flex; align-items: center; gap: 10px;">
            <div id="volume-bar"
                style="width: 100px; height: 10px; background: #ddd; border-radius: 5px; overflow: hidden;">
                <div id="volume-level" style="width: 0%; height: 100%; background: #28a745; transition: width 0.1s;">
                </div>
            </div>
            <div id="status" class="disconnected">Disconnected</div>
        </div>
    </header>

    <main>
        <div class="column" id="col-source">
            <div class="column-header" id="header-source">Nederlands (Bron)</div>
            <div class="column-content" id="list-source"></div>
        </div>
        <div class="column" id="col-trans1">
            <div class="column-header" id="header-trans1">English</div>
            <div class="column-content" id="list-trans1"></div>
        </div>
        <div class="column" id="col-trans3">
            <div class="column-header" id="header-trans3">Deutsch</div>
            <div class="column-content" id="list-trans3"></div>
        </div>
        <div class="column" id="col-trans2">
            <div class="column-header" id="header-trans2">Русский</div>
            <div class="column-content" id="list-trans2"></div>
        </div>
        <div class="column" id="col-trans4">
            <div class="column-header" id="header-trans4">Nederlands</div>
            <div class="column-content" id="list-trans4"></div>
        </div>
    </main>

    <script>
        const wsUrl = `ws://${window.location.host}/ws`;
        let socket;
        const statusDiv = document.getElementById('status');

        // Maps to store segment elements by ID to avoid re-querying DOM
        const segments = {
            source: {},
            trans1: {},
            trans2: {},
            trans3: {},
            trans4: {}
        };

        function connect() {
            socket = new WebSocket(wsUrl);

            socket.onopen = () => {
                statusDiv.textContent = 'Connected';
                statusDiv.className = 'connected';
                console.log("WebSocket connected");
                // Immediately scan input devices
                socket.send(JSON.stringify({ action: "get_devices" }));
            };

            socket.onclose = () => {
                statusDiv.textContent = 'Disconnected - Reconnecting...';
                statusDiv.className = 'disconnected';
                setTimeout(connect, 3000);
            };

            socket.onerror = (err) => {
                console.error("WebSocket error:", err);
                socket.close();
            };

            socket.onmessage = (event) => {
                const data = JSON.parse(event.data);
                if (data.type === 'volume') {
                    // Update volume bar (RMS usually 0-32000, but with gain maybe higher)
                    // Log scale approx: 
                    const pct = Math.min(100, Math.max(0, (data.rms / 2000) * 100));
                    document.getElementById('volume-level').style.width = pct + '%';
                } else {
                    handleMessage(data);
                }
            };
        }

        // Controls
        const sourceSelect = document.getElementById('source-lang');
        const target1Select = document.getElementById('target-lang-1');
        const target2Select = document.getElementById('target-lang-2');
        const target3Select = document.getElementById('target-lang-3');
        const target4Select = document.getElementById('target-lang-4');
        const audioSelect = document.getElementById('audio-device');
        const pauseBtn = document.getElementById('pause-btn');
        const rescanBtn = document.getElementById('rescan-btn');

        let isPaused = false;

        const LANG_DISPLAY = {
            'nl': 'Nederlands', 'nl-nl': 'Nederlands',
            'en': 'English', 'en-us': 'English', 'en-gb': 'English',
            'de': 'Deutsch', 'fr': 'Français', 'es': 'Español',
            'ru': 'Русский', 'uk': 'Українська', 'fa': 'فارسی', 'ar': 'العربية'
        };
        function getLangLabel(code, fallback) {
            if (!code) return fallback;
            const clean = String(code).toLowerCase().trim();
            return LANG_DISPLAY[clean] || LANG_DISPLAY[clean.split('-')[0]] || code.toUpperCase();
        }

        function updateColumnHeaders(src, t1, t3, t2, t4) {
            const s = src || (sourceSelect ? sourceSelect.value : '');
            const v1 = t1 || (target1Select ? target1Select.value : '');
            const v3 = t3 || (target3Select ? target3Select.value : '');
            const v2 = t2 || (target2Select ? target2Select.value : '');
            const v4 = t4 || (target4Select ? target4Select.value : '');

            if (s) {
                const el = document.getElementById('header-source');
                if (el) el.innerText = `${getLangLabel(s, 'Nederlands')} (Bron)`;
            }
            if (v1) {
                const el = document.getElementById('header-trans1');
                if (el) el.innerText = `${getLangLabel(v1, 'English')}`;
            }
            if (v3) {
                const el = document.getElementById('header-trans3');
                if (el) el.innerText = `${getLangLabel(v3, 'Deutsch')}`;
            }
            if (v2) {
                const el = document.getElementById('header-trans2');
                if (el) el.innerText = `${getLangLabel(v2, 'Русский')}`;
            }
            if (v4) {
                const el = document.getElementById('header-trans4');
                if (el) el.innerText = `${getLangLabel(v4, 'Nederlands')}`;
            }
        }

        function setSelectValue(selectElem, val) {
            if (!selectElem || !val) return;
            const cleanVal = String(val).toLowerCase().trim();
            for (let i = 0; i < selectElem.options.length; i++) {
                const optVal = selectElem.options[i].value.toLowerCase().trim();
                if (optVal === cleanVal || optVal.split('-')[0] === cleanVal.split('-')[0]) {
                    selectElem.selectedIndex = i;
                    return;
                }
            }
            const opt = document.createElement('option');
            opt.value = val;
            opt.text = `${getLangLabel(val, val)} (${val})`;
            selectElem.appendChild(opt);
            selectElem.value = val;
        }

        function sendConfig() {
            updateColumnHeaders(sourceSelect.value, target1Select.value, target3Select.value, target2Select.value, target4Select.value);
            if (socket && socket.readyState === WebSocket.OPEN) {
                const config = {
                    action: "update_config",
                    source_lang: sourceSelect.value,
                    target_lang_1: target1Select.value,
                    target_lang_2: target2Select.value,
                    target_lang_3: target3Select.value,
                    target_lang_4: target4Select.value,
                    enable_trans_3: document.getElementById('enable-trans-3').checked,
                    enable_trans_4: document.getElementById('enable-trans-4').checked,
                    paused: isPaused,
                    device_index: audioSelect.value
                };
                socket.send(JSON.stringify(config));
            }
        }

        function onSelectChange() {
            updateColumnHeaders(sourceSelect.value, target1Select.value, target3Select.value, target2Select.value, target4Select.value);
            sendConfig();
        }

        sourceSelect.addEventListener('change', onSelectChange);
        target1Select.addEventListener('change', onSelectChange);
        target2Select.addEventListener('change', onSelectChange);
        target3Select.addEventListener('change', onSelectChange);
        target4Select.addEventListener('change', onSelectChange);
        document.getElementById('enable-trans-3').addEventListener('change', sendConfig);
        document.getElementById('enable-trans-4').addEventListener('change', sendConfig);
        audioSelect.addEventListener('change', sendConfig);

        // Initial header sync
        updateColumnHeaders(sourceSelect.value, target1Select.value, target3Select.value, target2Select.value, target4Select.value);
        document.addEventListener('DOMContentLoaded', () => {
            updateColumnHeaders(sourceSelect.value, target1Select.value, target3Select.value, target2Select.value, target4Select.value);
        });

        rescanBtn.addEventListener('click', () => {
            if (socket && socket.readyState === WebSocket.OPEN) {
                socket.send(JSON.stringify({ action: "get_devices" }));
            }
        });

        pauseBtn.addEventListener('click', () => {
            isPaused = !isPaused;
            pauseBtn.innerText = isPaused ? "Resume" : "Pause";
            pauseBtn.style.background = isPaused ? "#dc3545" : "#007bff"; // Red when paused
            sendConfig();
        });

        document.getElementById('stop-btn').addEventListener('click', () => {
            if (confirm('Weet je zeker dat je de server wilt stoppen?')) {
                if (socket && socket.readyState === WebSocket.OPEN) {
                    socket.send(JSON.stringify({ action: "shutdown" }));
                }
                document.getElementById('status').textContent = 'Server gestopt';
                document.getElementById('status').className = 'disconnected';
            }
        });

        function updateColumnVisibility(e3, e4) {
            document.getElementById('col-trans3').style.display = e3 ? 'flex' : 'none';
            document.getElementById('col-trans4').style.display = e4 ? 'flex' : 'none';
            let cols = 3 + (e3 ? 1 : 0) + (e4 ? 1 : 0);
            document.querySelector('main').style.gridTemplateColumns = `repeat(${cols}, 1fr)`;
        }

        function handleMessage(data) {
            if (data.action === 'init_config' || data.action === 'update_config') {
                if (data.enable_trans_3 !== undefined) document.getElementById('enable-trans-3').checked = data.enable_trans_3;
                if (data.enable_trans_4 !== undefined) document.getElementById('enable-trans-4').checked = data.enable_trans_4;
                
                const sourceSelect = document.getElementById('source-lang');
                const target1Select = document.getElementById('target-lang-1');
                const target2Select = document.getElementById('target-lang-2');
                const target3Select = document.getElementById('target-lang-3');
                const target4Select = document.getElementById('target-lang-4');

                if (data.source_lang) setSelectValue(sourceSelect, data.source_lang);
                if (data.target_lang_1) setSelectValue(target1Select, data.target_lang_1);
                if (data.target_lang_3) setSelectValue(target3Select, data.target_lang_3);
                if (data.target_lang_2) setSelectValue(target2Select, data.target_lang_2);
                if (data.target_lang_4) setSelectValue(target4Select, data.target_lang_4);

                updateColumnHeaders(
                    data.source_lang || (sourceSelect ? sourceSelect.value : ''),
                    data.target_lang_1 || (target1Select ? target1Select.value : ''),
                    data.target_lang_3 || (target3Select ? target3Select.value : ''),
                    data.target_lang_2 || (target2Select ? target2Select.value : ''),
                    data.target_lang_4 || (target4Select ? target4Select.value : '')
                );

                // Sync device selection if provided by server
                if (data.device_index) {
                    const audioSelect = document.getElementById('audio-device');
                    // We might need to add the option if it's not in the hardcoded list yet
                    let found = false;
                    for (let i = 0; i < audioSelect.options.length; i++) {
                        if (audioSelect.options[i].value == data.device_index) {
                            audioSelect.value = data.device_index;
                            found = true;
                            break;
                        }
                    }
                    if (!found && data.device_index !== "demo_file") {
                        // Temporary option until rescan fills the list
                        const opt = document.createElement('option');
                        opt.value = data.device_index;
                        opt.text = "Selected Device (" + data.device_index + ")";
                        audioSelect.appendChild(opt);
                        audioSelect.value = data.device_index;
                    }
                }
                
                updateColumnVisibility(document.getElementById('enable-trans-3').checked, document.getElementById('enable-trans-4').checked);
                return;
            }
            if (data.action === 'auto_paused') {
                const pauseBtn = document.getElementById('pause-btn');
                window.isPaused = true;
                pauseBtn.innerText = "Resume";
                pauseBtn.style.background = "#dc3545";
                alert("The demo has been automatically paused after 30 minutes to manage cloud costs.\n\nClick 'Resume' if you wish to continue.");
                // We don't sendConfig back since the server already knows it's paused
            } else if (data.action === 'device_list') {
                const audioSelect = document.getElementById('audio-device');
                const currentValue = audioSelect.value;
                audioSelect.innerHTML = '<option value="default">Default Mic</option><option value="demo_file">Demo: BV.wav</option>';

                data.devices.forEach(dev => {
                    const option = document.createElement('option');
                    option.value = dev.index;
                    option.text = dev.name;
                    audioSelect.appendChild(option);
                });

                // Restore previous selection
                for (let i = 0; i < audioSelect.options.length; i++) {
                    if (audioSelect.options[i].value == currentValue) {
                        audioSelect.value = currentValue;
                        break;
                    }
                }
            }

            if (data.status === 'final' && data.id) {
                ['source', 'trans1', 'trans2', 'trans3', 'trans4'].forEach(c => {
                    const el = segments[c][data.id];
                    if (el) el.className = 'segment final';
                });
            }

            if (data.action === 'update_translation') {
                const listId = `list-${data.col_key}`;
                // Use 'final' style for async translations as they are stable
                updateColumn(data.col_key, listId, data.id, 'final', data.text);
            } else if (data.id) {
                // Standard STT update
                if (data.col1_text !== undefined) updateColumn('source', 'list-source', data.id, data.status, data.col1_text);
                if (data.col2_text !== undefined) updateColumn('trans1', 'list-trans1', data.id, data.status, data.col2_text);
                if (data.col3_text !== undefined) updateColumn('trans2', 'list-trans2', data.id, data.status, data.col3_text);
                if (data.col4_text !== undefined) updateColumn('trans3', 'list-trans3', data.id, data.status, data.col4_text);
                if (data.col5_text !== undefined) updateColumn('trans4', 'list-trans4', data.id, data.status, data.col5_text);
            }
        }

        function updateColumn(colKey, listId, segId, status, text) {
            if (!text) return;

            const listEl = document.getElementById(listId);
            let segEl = segments[colKey][segId];

            if (!segEl) {
                // Create new segment
                segEl = document.createElement('div');
                segEl.className = `segment ${status}`;
                segEl.id = `${colKey}-${segId}`;
                listEl.appendChild(segEl);
                segments[colKey][segId] = segEl;

                // Auto-scroll to bottom
                requestAnimationFrame(() => {
                    listEl.scrollTop = listEl.scrollHeight;
                });
            }

            if (segEl.classList.contains('final') && status === 'interim') {
                // Never demote a finalized segment back to interim/italic
                status = 'final';
            }

            // Update content and class
            segEl.textContent = text;
            segEl.className = `segment ${status}`;

            // Ensure auto-scroll triggers on every text update (both interim and final)
            requestAnimationFrame(() => {
                listEl.scrollTop = listEl.scrollHeight;
            });

            // If final, maybe animate or lock?
            if (status === 'final') {
                ['source', 'trans1', 'trans2', 'trans3', 'trans4'].forEach(c => {
                    const el = segments[c][segId];
                    if (el) el.className = 'segment final';
                });
            }
        }

        // Initialize connection
        connect();
    </script>
</body>

</html>
